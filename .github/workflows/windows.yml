name: Windows MSVC Ninja

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    steps:
      - name: Checkout PhysicsEngineCore
        uses: actions/checkout@v4

      - name: Set external build paths
        shell: pwsh
        run: |
          $ciRoot = Join-Path $env:RUNNER_TEMP 'physics-engine-ci'
          "CI_ROOT=$ciRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DEPS_DIR=$ciRoot\deps" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALL_DIR=$ciRoot\install" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_DIR=$ciRoot\build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress --yes

      - name: Initialize MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify MSVC toolchain
        shell: pwsh
        run: |
          $cl = Get-Command cl.exe -ErrorAction Stop
          Write-Output "Using MSVC compiler: $($cl.Source)"
          cl.exe 2>&1 | Select-Object -First 2

      - name: Checkout pinned sibling repositories
        shell: pwsh
        run: |
          ./tests/test_pinned_revision.ps1
          $repos = @{
            QuantumCore = @('https://github.com/StavrosMetalGear/QuantumCore.git', '529d5912af6f2e15f1f1a2b04b82f029b6c4e90c')
            ClassicalMechanicsCore = @('https://github.com/StavrosMetalGear/ClassicalMechanicsCore.git', '044a8fa6f13fbb32b96b45a27d499fafd853d088')
            ElectrodynamicsCore = @('https://github.com/StavrosMetalGear/ElectrodynamicsCore.git', '8ac6b1b0129f2815ff2c1f983eeab792307927b1')
            FluidDynamicsCore = @('https://github.com/StavrosMetalGear/FluidDynamicsCore.git', '895136a5d42271f4eaac840fece6987faefc6e7a')
            NuclearCore = @('https://github.com/StavrosMetalGear/NuclearCore.git', 'b3f7c180349d4b5d827ce27ba61bfbe0068f0497')
            OpticsCore = @('https://github.com/StavrosMetalGear/OpticsCore.git', 'f400d442191c64a1985ce49ddeed60b0dce4643b')
            SolidStateCore = @('https://github.com/StavrosMetalGear/SolidStateCore.git', 'd9fffbbcbe7da6417119cc5e49fc02d1d25b1982')
            ThermodynamicsCore = @('https://github.com/StavrosMetalGear/ThermodynamicsCore.git', 'c2013de01d5dd9b202b7ae9df7c4e10b973463a6')
          }
          New-Item -ItemType Directory -Force -Path $env:DEPS_DIR | Out-Null
          foreach ($entry in $repos.GetEnumerator()) {
            git clone $entry.Value[0] "$env:DEPS_DIR\$($entry.Key)"
            if ($LASTEXITCODE -ne 0) { throw "Clone failed for $($entry.Key): exit $LASTEXITCODE" }
            git -C "$env:DEPS_DIR\$($entry.Key)" checkout --detach $entry.Value[1]
            if ($LASTEXITCODE -ne 0) { throw "Checkout failed for $($entry.Key): exit $LASTEXITCODE" }
            ./scripts/check-pinned-revision.ps1 -RepositoryPath "$env:DEPS_DIR\$($entry.Key)" -ExpectedCommit $entry.Value[1]
          }

      - name: Configure
        shell: pwsh
        run: cmake -S . -B "$env:BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl.exe -DPHYSICSCORE_REPOS_DIR="$env:DEPS_DIR" -DPHYSICSCORE_ENABLE_C_API_CHECKS=ON

      - name: Build
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir "$env:BUILD_DIR" --output-on-failure

      - name: Verify C and C++ deprecation diagnostics
        shell: pwsh
        run: cmake -S tests/deprecation -B "$env:CI_ROOT\build-deprecation" -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Verify engine signature baseline checks
        shell: pwsh
        run: cmake -S tests/signature_baseline -B "$env:CI_ROOT\build-signature-baseline" -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Verify capability baseline checks
        shell: pwsh
        run: cmake -S tests/capability_baseline -B "$env:CI_ROOT\build-capability-baseline" -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Verify Quantum record layout baseline checks
        shell: pwsh
        run: cmake -S tests/quantum_layout_baseline -B "$env:CI_ROOT\build-quantum-layout" -G Ninja -DCMAKE_BUILD_TYPE=Release -DPHYSICSCORE_REPOS_DIR="$env:DEPS_DIR"

      - name: Install package
        shell: pwsh
        run: cmake --install "$env:BUILD_DIR" --prefix "$env:INSTALL_DIR"

      - name: Verify installed package version selection
        shell: pwsh
        run: cmake -DTEST_ROOT="$env:RUNNER_TEMP\physics-package-version-fixture" -DPACKAGE_PREFIX="$env:INSTALL_DIR" -P tests/package_version/test_version.cmake

      - name: Verify relocated package consumers
        shell: pwsh
        run: ./tests/package_relocation/test_relocation.ps1 -PackagePrefix "$env:INSTALL_DIR" -TestRoot "$env:RUNNER_TEMP\physics-package-relocation-fixture"

      - name: Verify installed header baselines
        shell: pwsh
        run: |
          cmake -S tests/installed_baseline -B "$env:CI_ROOT\build-installed-baseline" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:INSTALL_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:CI_ROOT\build-installed-baseline" --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:CI_ROOT\build-installed-baseline" --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed headers independently
        shell: pwsh
        run: |
          cmake -DTEST_ROOT="$env:RUNNER_TEMP\physics-header-manifest-fixture" -P tests/installed_headers/test_manifest.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S tests/installed_headers -B "$env:CI_ROOT\build-installed-headers" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:INSTALL_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:CI_ROOT\build-installed-headers" --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect installed static-library symbols
        shell: pwsh
        run: |
          ./tests/test_c_api_inventory.ps1 -ReposRoot "$env:DEPS_DIR" -HeadersRoot "$env:INSTALL_DIR\include" -TestRoot "$env:RUNNER_TEMP\physics-inventory-fixture"
          ./scripts/check-installed-c-api-inventory.ps1 -HeadersRoot "$env:INSTALL_DIR\include"
          ./tests/test_inspect_msvc_symbols.ps1 -LibraryPath "$env:INSTALL_DIR\lib\PhysicsEngine.lib" -EngineHeadersPath "$env:INSTALL_DIR\include"
          ./tests/test_compare_msvc_c_symbols.ps1
          ./tests/test_compare_package_headers.ps1
          ./scripts/inspect-msvc-symbols.ps1 -LibraryPath "$env:INSTALL_DIR\lib\PhysicsEngine.lib" -EngineHeadersPath "$env:INSTALL_DIR\include" -SymbolListPath "$env:RUNNER_TEMP\PhysicsEngine-symbols.txt"

      - name: Record compatibility evidence
        shell: pwsh
        run: |
          ./tests/test_compatibility_evidence.ps1
          ./scripts/write-compatibility-evidence.ps1 -ProjectRoot "$env:GITHUB_WORKSPACE" -ReposRoot "$env:DEPS_DIR" -BuildRoot "$env:BUILD_DIR" -PackageRoot "$env:INSTALL_DIR" -SymbolListPath "$env:RUNNER_TEMP\PhysicsEngine-symbols.txt" -OutputPath "$env:RUNNER_TEMP\PhysicsEngine-evidence.json"

      - name: Build external consumer
        shell: pwsh
        run: |
          cmake -S examples/consumer -B "$env:CI_ROOT\consumer-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:INSTALL_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:CI_ROOT\consumer-build" --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:CI_ROOT\consumer-build\physics_engine_consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test external C consumer
        shell: pwsh
        run: |
          cmake -S examples/c_consumer -B "$env:CI_ROOT\c-consumer-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:INSTALL_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:CI_ROOT\c-consumer-build" --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:CI_ROOT\c-consumer-build" --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload symbol list and compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: PhysicsEngineCore-symbols-${{ github.sha }}
          path: |
            ${{ runner.temp }}\PhysicsEngine-symbols.txt
            ${{ runner.temp }}\PhysicsEngine-evidence.json
          if-no-files-found: error

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PhysicsEngineCore-${{ github.sha }}
          path: ${{ runner.temp }}\physics-engine-ci\install
