name: Windows MSVC Ninja

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    env:
      DEPS_DIR: ${{ github.workspace }}\deps
      INSTALL_DIR: ${{ github.workspace }}\install
    steps:
      - name: Checkout PhysicsEngineCore
        uses: actions/checkout@v4

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress --yes

      - name: Initialize MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify MSVC toolchain
        shell: pwsh
        run: |
          $cl = Get-Command cl.exe -ErrorAction Stop
          Write-Output "Using MSVC compiler: $($cl.Source)"
          cl.exe 2>&1 | Select-Object -First 2

      - name: Checkout pinned sibling repositories
        shell: pwsh
        run: |
          $repos = @{
            QuantumCore = @('https://github.com/StavrosMetalGear/QuantumCore.git', '529d5912af6f2e15f1f1a2b04b82f029b6c4e90c')
            ClassicalMechanicsCore = @('https://github.com/StavrosMetalGear/ClassicalMechanicsCore.git', '044a8fa6f13fbb32b96b45a27d499fafd853d088')
            ElectrodynamicsCore = @('https://github.com/StavrosMetalGear/ElectrodynamicsCore.git', '8ac6b1b0129f2815ff2c1f983eeab792307927b1')
            FluidDynamicsCore = @('https://github.com/StavrosMetalGear/FluidDynamicsCore.git', '895136a5d42271f4eaac840fece6987faefc6e7a')
            NuclearCore = @('https://github.com/StavrosMetalGear/NuclearCore.git', 'b3f7c180349d4b5d827ce27ba61bfbe0068f0497')
            OpticsCore = @('https://github.com/StavrosMetalGear/OpticsCore.git', 'f400d442191c64a1985ce49ddeed60b0dce4643b')
            SolidStateCore = @('https://github.com/StavrosMetalGear/SolidStateCore.git', 'd9fffbbcbe7da6417119cc5e49fc02d1d25b1982')
            ThermodynamicsCore = @('https://github.com/StavrosMetalGear/ThermodynamicsCore.git', 'c2013de01d5dd9b202b7ae9df7c4e10b973463a6')
          }
          New-Item -ItemType Directory -Force -Path $env:DEPS_DIR | Out-Null
          foreach ($entry in $repos.GetEnumerator()) {
            git clone $entry.Value[0] "$env:DEPS_DIR\$($entry.Key)"
            git -C "$env:DEPS_DIR\$($entry.Key)" checkout --detach $entry.Value[1]
          }

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl.exe -DPHYSICSCORE_REPOS_DIR="$env:DEPS_DIR" -DPHYSICSCORE_ENABLE_C_API_CHECKS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure

      - name: Verify C and C++ deprecation diagnostics
        shell: pwsh
        run: cmake -S tests/deprecation -B build-deprecation -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Verify engine signature baseline checks
        shell: pwsh
        run: cmake -S tests/signature_baseline -B build-signature-baseline -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Verify capability baseline checks
        shell: pwsh
        run: cmake -S tests/capability_baseline -B build-capability-baseline -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Verify Quantum record layout baseline checks
        shell: pwsh
        run: cmake -S tests/quantum_layout_baseline -B build-quantum-layout -G Ninja -DCMAKE_BUILD_TYPE=Release -DPHYSICSCORE_REPOS_DIR="$env:DEPS_DIR"

      - name: Install package
        shell: pwsh
        run: cmake --install build --prefix "$env:INSTALL_DIR"

      - name: Verify installed package version selection
        shell: pwsh
        run: cmake -DTEST_ROOT="$env:RUNNER_TEMP\physics-package-version-fixture" -DPACKAGE_PREFIX="$env:INSTALL_DIR" -P tests/package_version/test_version.cmake

      - name: Verify relocated package consumers
        shell: pwsh
        run: ./tests/package_relocation/test_relocation.ps1 -PackagePrefix "$env:INSTALL_DIR" -TestRoot "$env:RUNNER_TEMP\physics-package-relocation-fixture"

      - name: Verify installed header baselines
        shell: pwsh
        run: |
          cmake -S tests/installed_baseline -B build-installed-baseline -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:INSTALL_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-installed-baseline --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-installed-baseline --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed headers independently
        shell: pwsh
        run: |
          cmake -DTEST_ROOT="$env:RUNNER_TEMP\physics-header-manifest-fixture" -P tests/installed_headers/test_manifest.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S tests/installed_headers -B build-installed-headers -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:INSTALL_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-installed-headers --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect installed static-library symbols
        shell: pwsh
        run: |
          ./tests/test_c_api_inventory.ps1 -ReposRoot "$env:DEPS_DIR" -TestRoot "$env:RUNNER_TEMP\physics-inventory-fixture"
          ./tests/test_inspect_msvc_symbols.ps1 -LibraryPath "$env:INSTALL_DIR\lib\PhysicsEngine.lib"
          ./tests/test_compare_msvc_c_symbols.ps1
          ./scripts/inspect-msvc-symbols.ps1 -LibraryPath "$env:INSTALL_DIR\lib\PhysicsEngine.lib" -SymbolListPath "$env:RUNNER_TEMP\PhysicsEngine-symbols.txt"

      - name: Build external consumer
        shell: pwsh
        run: |
          cmake -S examples/consumer -B consumer-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:INSTALL_DIR"
          cmake --build consumer-build --parallel 2
          .\consumer-build\physics_engine_consumer.exe

      - name: Build and test external C consumer
        shell: pwsh
        run: |
          cmake -S examples/c_consumer -B c-consumer-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:INSTALL_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build c-consumer-build --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir c-consumer-build --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload static-library symbol list
        uses: actions/upload-artifact@v4
        with:
          name: PhysicsEngineCore-symbols-${{ github.sha }}
          path: ${{ runner.temp }}\PhysicsEngine-symbols.txt
          if-no-files-found: error

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PhysicsEngineCore-${{ github.sha }}
          path: ${{ env.INSTALL_DIR }}
